# MuJoCo 3.x through scenes.pick_place.run.PickPlaceScene (derived scene, per-step audits).
backend: mujoco
python: /Users/puheliang/miniforge3/envs/inovance-fineart/bin/python
robot: config/robot/franzi_sdk.yaml
connection: config/connections/sim_mujoco.yaml
runtime:
  loop: framework            # framework: the bridge calls step(); simulator: the engine loop calls hooks
  realtime_factor: 1.0       # 0 = as fast as possible
  idle_timeout_s: 60
  command_timeout_s: 2.0
  display_camera: overview
  record_inset_size: [320, 240]
  record_every_samples: 1    # 1 = every 25 Hz trace sample
