# MuJoCo at 0.1x real time, for recording four 640x480 cameras on simulated time
# (record_sdk_episode.py, clock "sim"). Each camera renders on the physics thread
# in about 19 ms, so four of them cannot follow 25 Hz in real time; at 0.1x a
# 40 ms tick takes about 0.4 s of wall time. Teleop pushes then arrive more than
# teleop_max_gap_s (0.2 s) apart, so simbridge plays each point over
# teleop_default_period_s (0.04 s) of simulated time: one point per tick.
backend: mujoco
python: /Users/puheliang/miniforge3/envs/inovance-fineart/bin/python
robot: config/robot/franzi_sdk.yaml
connection: config/connections/sim_mujoco.yaml
runtime:
  loop: framework
  realtime_factor: 0.1
  idle_timeout_s: 60
  command_timeout_s: 2.0
  display_camera: overview
  record_inset_size: [320, 240]
  record_every_samples: 1
